name: Generate Snake

on:
  # Refresh the snake every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate whenever the profile changes
  push:
    branches:
      - main
    paths-ignore:
      - "assets/snake-*.svg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=%2339d353
            assets/snake-light.svg?palette=github-light&color_snake=%23216e39

      - name: Commit updated snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          add: "assets"
          default_author: github_actions
